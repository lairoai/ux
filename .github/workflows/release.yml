name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve-tag:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$RAW_TAG" =~ ^v ]]; then
            RAW_TAG="v$RAW_TAG"
          fi
          echo "version=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $RAW_TAG"

  release:
    name: Build and release
    needs: resolve-tag
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o ux-${{ matrix.suffix }}${{ matrix.ext }} \
            ./cmd/ux

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ux-${{ matrix.suffix }}
          path: ux-${{ matrix.suffix }}${{ matrix.ext }}

  publish:
    name: Publish GitHub Release
    needs: [resolve-tag, release]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ux-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.version }}
          files: dist/*
          generate_release_notes: true

